<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--a:#f05a28}
html,body{width:100%;height:100%;background:#111;font-family:'Nunito',sans-serif;color:white;overflow-y:auto;user-select:none}
::-webkit-scrollbar{width:0}
.bar{display:flex;align-items:center;gap:14px;padding:52px 20px 14px;position:sticky;top:0;background:#111;z-index:10}
.back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;color:white;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bar h2{font-size:26px;font-weight:700}
.slbl{font-size:11px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;padding:4px 16px 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px 30px}
.card{border-radius:20px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all .35s cubic-bezier(.34,1.4,.64,1);position:relative}
.card.on{border-color:var(--a);box-shadow:0 0 0 1px rgba(240,90,40,0.3),0 8px 24px rgba(240,90,40,0.2)}
.prev{height:140px;display:flex;align-items:center;justify-content:center;font-size:46px;position:relative;overflow:hidden}
.prev::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,0.06),transparent 40%)}
.lbl{background:rgba(255,255,255,0.07);padding:10px 14px;font-size:13px;font-weight:600}
.tick{position:absolute;top:8px;right:8px;width:26px;height:26px;background:var(--a);border-radius:50%;display:none;align-items:center;justify-content:center;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(240,90,40,0.5)}
.card.on .tick{display:flex}
.sp{height:20px}
/* Wallpaper section */
.wp-scroll{display:flex;gap:10px;padding:0 16px 20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.wp-item{flex-shrink:0;width:100px;height:180px;border-radius:16px;cursor:pointer;display:flex;align-items:flex-end;padding:8px;border:2px solid transparent;transition:all .3s}
.wp-item.on{border-color:var(--a)}
.wp-name{font-size:10px;font-weight:700;text-align:center;width:100%;text-shadow:0 1px 4px rgba(0,0,0,0.8)}
</style></head><body>
<div class="bar"><button class="back" onclick="window.parent.postMessage({type:'close-app'},'*')">‹</button><h2>Темы</h2></div>

<div class="slbl">Цветовые схемы</div>
<div class="grid" id="grid"></div>

<div class="slbl">Обои</div>
<div class="wp-scroll" id="wpscroll"></div>
<div class="sp"></div>

<script>
const THEMES=[
  {id:'cosmic', n:'Cosmic Night',   bg:'linear-gradient(135deg,#0f0c29,#302b63,#24243e)', e:'🌌'},
  {id:'aurora', n:'Aurora',         bg:'linear-gradient(135deg,#004d40,#00695c,#1a237e)', e:'🌿'},
  {id:'sunset', n:'Crimson Sunset', bg:'linear-gradient(135deg,#b71c1c,#e64a19,#f57f17)', e:'🌅'},
  {id:'ocean',  n:'Deep Ocean',     bg:'linear-gradient(135deg,#0d47a1,#01579b,#006064)', e:'🌊'},
  {id:'rose',   n:'Rose Night',     bg:'linear-gradient(135deg,#880e4f,#4a148c,#1a237e)', e:'🌸'},
  {id:'forest', n:'Dark Forest',    bg:'linear-gradient(135deg,#1b5e20,#2e7d32,#33691e)', e:'🌲'},
  {id:'oneplue',n:'Never Settle',   bg:'linear-gradient(135deg,#1a0000,#3d0a00,#200000)', e:'🔥'},
  {id:'galaxy', n:'Galaxy',         bg:'linear-gradient(135deg,#0d0221,#190940,#0d0221)', e:'✨'},
];

const WALLPAPERS=[
  {n:'Туманность',bg:'radial-gradient(ellipse at 30% 40%,#6c5ce7,#0984e3,#00b894)',e:'🌌'},
  {n:'Закат',    bg:'linear-gradient(180deg,#1a0000,#e64a19,#fdcb6e)',e:'🌅'},
  {n:'Лес',      bg:'linear-gradient(160deg,#0a290a,#1b5e20,#2e7d32)',e:'🌲'},
  {n:'Океан',    bg:'linear-gradient(180deg,#001f3f,#0984e3,#00cec9)',e:'🌊'},
  {n:'Аврора',   bg:'linear-gradient(160deg,#004d40,#00695c,#1a237e)',e:'🌿'},
  {n:'Огонь',    bg:'linear-gradient(180deg,#1a0000,#c0392b,#e67e22)',e:'🔥'},
];

const saved=localStorage.getItem('theme')||'cosmic';
const grid=document.getElementById('grid');
grid.innerHTML=THEMES.map(t=>`
  <div class="card ${t.id===saved?'on':''}" id="tc-${t.id}" onclick="pick('${t.id}','${t.n}')">
    <div class="prev" style="background:${t.bg}">${t.e}</div>
    <div class="lbl">${t.n}</div>
    <div class="tick">✓</div>
  </div>`).join('');

const wp=document.getElementById('wpscroll');
wp.innerHTML=WALLPAPERS.map((w,i)=>`
  <div class="wp-item ${i===0?'on':''}" onclick="pickWP(this,'${w.n}')" style="background:${w.bg}">
    <div class="wp-name">${w.n}</div>
  </div>`).join('');

function pick(id,name){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('on'));
  document.getElementById('tc-'+id).classList.add('on');
  localStorage.setItem('theme',id);
  window.parent.postMessage({type:'apply-theme',theme:id},'*');
  window.parent.postMessage({type:'show-notif',icon:'🎨',app:'Темы',body:'Тема «'+name+'» применена!'},'*');
}
function pickWP(el,name){
  document.querySelectorAll('.wp-item').forEach(w=>w.classList.remove('on'));
  el.classList.add('on');
  window.parent.postMessage({type:'show-notif',icon:'🖼','app':'Темы',body:'Обои «'+name+'» установлены!'},'*');
}
</script>
</body></html>
