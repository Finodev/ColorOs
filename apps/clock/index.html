<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--a:#f05a28}
html,body{width:100%;height:100%;background:#111;font-family:'Nunito',sans-serif;color:white;overflow:hidden;user-select:none}
.bar{display:flex;align-items:center;gap:14px;padding:52px 20px 10px}
.back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;color:white;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bar h2{font-size:26px;font-weight:700}
.tabs{display:flex;gap:8px;padding:0 16px 14px}
.tab{padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.55)}
.tab.on{background:var(--a);color:white}
.panel{display:none;padding:0 16px}.panel.on{display:block}
/* Analog */
.clock-wrap{width:210px;height:210px;margin:10px auto 16px}
.face{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 38% 35%,#1e1e2e,#0a0a14);border:2px solid rgba(255,255,255,0.1);box-shadow:0 0 40px rgba(240,90,40,0.15),inset 0 0 30px rgba(0,0,0,0.5);position:relative;display:flex;align-items:center;justify-content:center}
.hand{position:absolute;bottom:50%;left:50%;transform-origin:bottom center;border-radius:4px}
.hh{width:4px;height:62px;background:white;margin-left:-2px}
.hm{width:3px;height:82px;background:rgba(255,255,255,0.8);margin-left:-1.5px}
.hs{width:2px;height:90px;background:var(--a);margin-left:-1px}
.center{width:10px;height:10px;background:var(--a);border-radius:50%;position:absolute;box-shadow:0 0 8px var(--a)}
.dig{font-size:46px;font-weight:200;text-align:center;letter-spacing:-2px}
.tz{font-size:13px;color:rgba(255,255,255,0.4);text-align:center;margin-top:4px}
/* Timer */
.tdis{font-size:72px;font-weight:200;text-align:center;padding:20px 0;letter-spacing:-3px}
.tbtns{display:flex;gap:12px;justify-content:center;margin-bottom:16px}
.tbtn{padding:14px 32px;border-radius:100px;border:none;font-size:16px;font-weight:600;cursor:pointer;font-family:'Nunito',sans-serif;transition:transform .15s}
.tbtn:active{transform:scale(0.92)}
.tgo{background:var(--a);color:white}.trst{background:rgba(255,255,255,0.1);color:white}
.presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pr{padding:8px 14px;border-radius:100px;background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.65);border:none;cursor:pointer;font-size:13px;font-family:'Nunito',sans-serif;transition:background .2s}
.pr:hover{background:rgba(255,255,255,0.12);color:white}
/* Alarms */
.alarms{display:flex;flex-direction:column;gap:10px;max-height:400px;overflow-y:auto}
.ala{background:rgba(255,255,255,0.06);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:14px}
.ala-t{font-size:36px;font-weight:200;letter-spacing:-1px}
.ala-d{font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px}
.tog{width:48px;height:28px;background:rgba(255,255,255,0.15);border-radius:14px;position:relative;cursor:pointer;transition:background .3s;margin-left:auto}
.tog.on{background:var(--a)}.tog::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;background:white;border-radius:50%;transition:left .3s cubic-bezier(.34,1.4,.64,1)}.tog.on::after{left:23px}
.add-btn{width:100%;padding:16px;margin-top:12px;background:rgba(240,90,40,0.15);border:1px solid rgba(240,90,40,0.3);border-radius:16px;color:var(--a);font-size:16px;font-weight:600;cursor:pointer;font-family:'Nunito',sans-serif;transition:background .2s}
.add-btn:hover{background:rgba(240,90,40,0.25)}
</style>
</head><body>
<div class="bar"><button class="back" onclick="window.parent.postMessage({type:'close-app'},'*')">‹</button><h2>Часы</h2></div>
<div class="tabs">
  <div class="tab on" onclick="sw('a',this)">Аналог</div>
  <div class="tab" onclick="sw('t',this)">Таймер</div>
  <div class="tab" onclick="sw('al',this)">Будильник</div>
</div>
<div class="panel on" id="pa">
  <div class="clock-wrap"><div class="face"><div class="hand hh" id="hh"></div><div class="hand hm" id="hm"></div><div class="hand hs" id="hs"></div><div class="center"></div></div></div>
  <div class="dig" id="ddig">00:00:00</div><div class="tz">МСК (UTC+3)</div>
</div>
<div class="panel" id="pt">
  <div class="tdis" id="tdis">00:00</div>
  <div class="tbtns"><button class="tbtn tgo" id="tbtn" onclick="togTimer()">Старт</button><button class="tbtn trst" onclick="rstTimer()">Сброс</button></div>
  <div class="presets">
    <button class="pr" onclick="setT(60)">1 мин</button>
    <button class="pr" onclick="setT(300)">5 мин</button>
    <button class="pr" onclick="setT(600)">10 мин</button>
    <button class="pr" onclick="setT(1800)">30 мин</button>
    <button class="pr" onclick="setT(3600)">1 час</button>
  </div>
</div>
<div class="panel" id="pal">
  <div class="alarms" id="alarms"></div>
  <button class="add-btn" onclick="addAlarm()">+ Добавить будильник</button>
</div>
<script>
const pad=n=>String(n).padStart(2,'0');
function getMSK(){const n=new Date();return new Date(n.getTime()+(n.getTimezoneOffset()+180)*60000)}
function tick(){
  const t=getMSK();const h=t.getHours(),m=t.getMinutes(),s=t.getSeconds();
  document.getElementById('hh').style.transform=`translateX(-50%) rotate(${h%12*30+m*0.5}deg)`;
  document.getElementById('hm').style.transform=`translateX(-50%) rotate(${m*6+s*0.1}deg)`;
  document.getElementById('hs').style.transform=`translateX(-50%) rotate(${s*6}deg)`;
  document.getElementById('ddig').textContent=pad(h)+':'+pad(m)+':'+pad(s);
}
setInterval(tick,1000);tick();
function sw(id,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));document.getElementById('p'+id).classList.add('on')}
// Timer
let tsec=0,tset=0,trun=false,tint=null;
function togTimer(){if(!trun){if(!tsec&&tset)tsec=tset;if(!tsec){tsec=60;tset=60}trun=true;document.getElementById('tbtn').textContent='Пауза';tint=setInterval(()=>{if(tsec>0){tsec--;updT()}else{clearInterval(tint);trun=false;document.getElementById('tbtn').textContent='Старт';window.parent.postMessage({type:'show-notif',icon:'⏰',app:'Часы',body:'Таймер закончился!'},'*')}},1000)}else{trun=false;clearInterval(tint);document.getElementById('tbtn').textContent='Старт'}}
function rstTimer(){clearInterval(tint);trun=false;tsec=tset;updT();document.getElementById('tbtn').textContent='Старт'}
function setT(s){tset=tsec=s;updT()}
function updT(){const m=Math.floor(tsec/60),s=tsec%60;document.getElementById('tdis').textContent=pad(m)+':'+pad(s)}
// Alarms
let alarms=[{t:'07:30',d:'Пн Вт Ср Чт Пт',on:true},{t:'09:00',d:'Сб Вс',on:false}];
function renderAlarms(){
  const el=document.getElementById('alarms');
  el.innerHTML=alarms.map((a,i)=>`<div class="ala"><div style="flex:1"><div class="ala-t">${a.t}</div><div class="ala-d">${a.d}</div></div><div class="tog ${a.on?'on':''}" onclick="alarms[${i}].on=!alarms[${i}].on;this.classList.toggle('on')"></div></div>`).join('');
}
function addAlarm(){const h=pad(Math.floor(Math.random()*12)+6),m=['00','15','30','45'][Math.floor(Math.random()*4)];alarms.push({t:h+':'+m,d:'Пн Вт Ср Чт Пт',on:true});renderAlarms();window.parent.postMessage({type:'show-notif',icon:'⏰',app:'Часы',body:'Будильник '+h+':'+m+' добавлен'},'*')}
renderAlarms();
</script>
</body></html>
