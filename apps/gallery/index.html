<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#111;font-family:'Nunito',sans-serif;color:white;overflow:hidden;user-select:none}
.bar{display:flex;align-items:center;gap:14px;padding:52px 20px 14px;background:#111;position:sticky;top:0;z-index:10}
.back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;color:white;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bar h2{font-size:26px;font-weight:700;flex:1}.count{font-size:13px;color:rgba(255,255,255,0.4)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;overflow-y:auto;height:calc(100% - 110px)}
.cell{aspect-ratio:1;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:52px;animation:gi .35s ease both;transition:transform .2s}
.cell:active{transform:scale(0.95)}
@keyframes gi{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:none}}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.96);z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.lb.open{display:flex;animation:lbi .3s cubic-bezier(0.34,1.4,0.64,1)}
@keyframes lbi{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:none}}
.lb-e{font-size:130px}.lb-n{font-size:16px;color:rgba(255,255,255,0.55)}
.lb-close{padding:12px 28px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:100px;color:white;font-size:15px;font-weight:600;cursor:pointer;font-family:'Nunito',sans-serif}
</style>
</head><body>
<div class="bar"><button class="back" onclick="window.parent.postMessage({type:'close-app'},'*')">‹</button><h2>Галерея</h2><span class="count">12 фото</span></div>
<div class="grid" id="grid"></div>
<div class="lb" id="lb"><div class="lb-e" id="lb-e"></div><div class="lb-n" id="lb-n"></div><button class="lb-close" onclick="document.getElementById('lb').classList.remove('open')">Закрыть</button></div>
<script>
const items=[{e:'🌌',n:'Космос',bg:'linear-gradient(135deg,#667eea,#764ba2)'},{e:'🌅',n:'Закат',bg:'linear-gradient(135deg,#f093fb,#f5576c)'},{e:'🌊',n:'Океан',bg:'linear-gradient(135deg,#4facfe,#00f2fe)'},{e:'🏔',n:'Горы',bg:'linear-gradient(135deg,#43e97b,#38f9d7)'},{e:'🌸',n:'Цветы',bg:'linear-gradient(135deg,#fa709a,#fee140)'},{e:'🦋',n:'Бабочка',bg:'linear-gradient(135deg,#a18cd1,#fbc2eb)'},{e:'🔥',n:'Огонь',bg:'linear-gradient(135deg,#fd7043,#ff8a65)'},{e:'🌙',n:'Луна',bg:'linear-gradient(135deg,#a1c4fd,#c2e9fb)'},{e:'⚡',n:'Молния',bg:'linear-gradient(135deg,#ffecd2,#fcb69f)'},{e:'🎆',n:'Фейерверк',bg:'linear-gradient(135deg,#80deea,#26c6da)'},{e:'🌺',n:'Тропики',bg:'linear-gradient(135deg,#ce93d8,#ab47bc)'},{e:'🎇',n:'Искры',bg:'linear-gradient(135deg,#f48fb1,#e91e63)'}];
const g=document.getElementById('grid');
items.forEach((it,i)=>{const d=document.createElement('div');d.className='cell';d.style.cssText='background:'+it.bg+';animation-delay:'+i*0.03+'s';d.textContent=it.e;d.onclick=()=>{document.getElementById('lb-e').textContent=it.e;document.getElementById('lb-n').textContent=it.n;document.getElementById('lb').classList.add('open')};g.appendChild(d)});
</script>
</body></html>
